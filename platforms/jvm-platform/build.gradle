/**
 The jvm-platform is the single source of truth for the versions of all dependencies of the library and its tests.
 Builds declare dependencies without a version.
 */

plugins {
  id('java-platform')
}

group = 'io.meshcloud.openapi-spec-for-spring.platform'

javaPlatform.allowDependencies()

dependencies {
  api(platform('org.springframework.boot:spring-boot-dependencies:3.5.16'))

  constraints {
    api('org.projectlombok:lombok:1.18.48')

    api('org.jspecify:jspecify:1.0.1')
    api('com.google.code.findbugs:jsr305:3.0.2')
    api('io.swagger.core.v3:swagger-annotations:2.2.55')

    api('commons-io:commons-io:2.22.0')

    api('com.google.errorprone:error_prone_core:2.50.0')
    api('com.uber.nullaway:nullaway:0.14.2')
  }
}
