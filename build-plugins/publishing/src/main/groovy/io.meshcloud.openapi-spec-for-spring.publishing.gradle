plugins {
  id('io.meshcloud.openapi-spec-for-spring.java-library')
  id('maven-publish')
}

java {
  withSourcesJar()
  withJavadocJar()
}

tasks.named('javadoc', Javadoc) {
  options.tags('implNote:a:Implementation note:')
  options.addBooleanOption('Xdoclint:all,-missing', true)
  options.quiet()
}

// Inserted after the artifactId base name, e.g. '-boot3' yields openapi-generator-for-spring-boot3-starter.
def springBootArtifactIdSuffix = ''
def artifactIdBaseName = 'openapi-generator-for-spring'

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = project.name.replaceFirst(artifactIdBaseName, artifactIdBaseName + springBootArtifactIdSuffix)
      from(components.java)
      versionMapping {
        allVariants {
          fromResolutionResult()
        }
      }
      pom {
        name = provider { project.description }
        url = 'https://github.com/meshcloud/openapi-spec-for-spring'
        licenses {
          license {
            name = 'Apache License v2'
            url = 'https://opensource.org/licenses/Apache-2.0'
          }
        }
        scm {
          url = 'https://github.com/meshcloud/openapi-spec-for-spring'
          connection = 'scm:git:https://github.com/meshcloud/openapi-spec-for-spring.git'
        }
      }
    }
  }
  repositories {
    maven {
      name = 'GitHubPackages'
      url = 'https://maven.pkg.github.com/meshcloud/openapi-spec-for-spring'
      credentials {
        username = providers.environmentVariable('GITHUB_ACTOR').orNull
        password = providers.environmentVariable('GITHUB_TOKEN').orNull
      }
    }
  }
}
