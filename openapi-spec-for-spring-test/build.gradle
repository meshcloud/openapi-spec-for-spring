plugins {
  id('io.meshcloud.openapi-spec-for-spring.java-library')
  id('jacoco-report-aggregation')
  id('org.jetbrains.kotlin.jvm') version '2.4.21'
}

description = 'OpenAPI Spec for Spring :: Test'

dependencies {
  // The aggregated coverage report covers the projects on this list.
  implementation(project(':openapi-spec-for-spring-model'))
  implementation(project(':openapi-spec-for-spring-api'))
  implementation(project(':openapi-spec-for-spring-common'))
  implementation(project(':openapi-spec-for-spring-autoconfigure'))
  implementation(project(':openapi-spec-for-spring-web'))
  implementation(project(':openapi-spec-for-spring-webmvc'))
  implementation(project(':openapi-spec-for-spring-hateoas'))
  implementation(project(':openapi-spec-for-spring-data'))

  testImplementation('org.springframework.boot:spring-boot-starter-web')
  testImplementation('org.springframework.boot:spring-boot-starter-security')
  testImplementation('org.springframework.boot:spring-boot-starter-hateoas')
  testImplementation('org.springframework.data:spring-data-commons')
  testImplementation('commons-io:commons-io')
  testImplementation('org.jetbrains.kotlin:kotlin-stdlib')
  testImplementation('org.jetbrains.kotlin:kotlin-reflect')
  testImplementation('com.fasterxml.jackson.module:jackson-module-kotlin')
  testImplementation('com.google.code.findbugs:jsr305')
  testImplementation('jakarta.servlet:jakarta.servlet-api')
  testImplementation('jakarta.validation:jakarta.validation-api')
}

// Kotlin test classes must target the same JVM as the Java ones.
kotlin {
  compilerOptions {
    allWarningsAsErrors = true
    jvmTarget = tasks.named('compileTestJava', JavaCompile).flatMap {
      it.options.release
    }
    .map {
      org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(it.toString())
    }
  }
}

// YAML on the classpath changes what Spring MVC serves, so the YAML tests run with their own classpath.
testing {
  suites {
    yamlTest(JvmTestSuite) {
      dependencies {
        implementation(sourceSets.test.output)
        implementation('com.fasterxml.jackson.dataformat:jackson-dataformat-yaml')
      }
    }
    // The parser brings YAML too, so it checks the expected files, which equal the served specs.
    specValidityTest(JvmTestSuite) {
      dependencies {
        implementation('io.swagger.parser.v3:swagger-parser-v3')
      }
      targets.all {
        testTask.configure {
          def expectedSpecDirs = files('src/test/resources/openApiJson', 'src/yamlTest/resources/openApiYaml')
          inputs.files(expectedSpecDirs).withPathSensitivity(PathSensitivity.RELATIVE)
          systemProperty('expectedSpecDirs', expectedSpecDirs.files.join(File.pathSeparator))
        }
      }
    }
  }
}

configurations {
  yamlTestImplementation.extendsFrom(testImplementation)
  yamlTestRuntimeOnly.extendsFrom(testRuntimeOnly)
  yamlTestCompileOnly.extendsFrom(testCompileOnly)
  yamlTestAnnotationProcessor.extendsFrom(testAnnotationProcessor)
}

reporting {
  reports {
    yamlTestCodeCoverageReport(JacocoCoverageReport) {
      testSuiteName = 'yamlTest'
    }
  }
}

tasks.withType(JacocoReport).configureEach {
  reports.xml.required = true
}

sonar {
  properties {
    properties['sonar.tests'] += sourceSets.yamlTest.java.srcDirs
    properties['sonar.java.test.binaries'] += sourceSets.yamlTest.output.classesDirs.files
  }
}

tasks.named('check') {
  dependsOn(tasks.named('yamlTest'), tasks.named('specValidityTest'), tasks.named('testCodeCoverageReport'), tasks.named('yamlTestCodeCoverageReport'))
}
