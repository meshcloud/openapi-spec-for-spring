name: build

on:
  pull_request:
    branches:
      - 'spring-boot-[0-9]+.x'
  push:
    branches:
      - 'spring-boot-[0-9]+.x'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A step condition cannot read secrets, only the environment of the job.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud reads the history to find new code and to blame issues.
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      # Without cache-provider, the action uses Gradle's commercial caching service.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - run: nix develop --command ./gradlew build
      # Pull requests from forks and from Dependabot get no secrets.
      - if: env.SONAR_TOKEN != ''
        run: nix develop --command ./gradlew sonar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: openapi-spec-for-spring-test/build/reports/jacoco/testCodeCoverageReport/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
