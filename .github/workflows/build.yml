name: build

on:
  pull_request:
    branches:
      - 'spring-boot-[0-9]+.x'
  push:
    branches:
      - 'spring-boot-[0-9]+.x'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A step condition cannot read secrets, only the environment of the job.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud reads the history to find new code and to blame issues.
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      # Without cache-provider, the action uses Gradle's commercial caching service.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - run: nix develop --command ./gradlew build
      # Pull requests from forks and from Dependabot get no secrets.
      - if: env.SONAR_TOKEN != ''
        run: nix develop --command ./gradlew sonar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: openapi-spec-for-spring-test/build/reports/jacoco/testCodeCoverageReport/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  publish-snapshot:
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency: publish-snapshot-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Derive the snapshot version from the branch
        id: version
        run: echo "version=${BRANCH}${PR:+-PR-$PR}-SNAPSHOT" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
      - run: nix develop --command ./gradlew publish -Pversion="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "Published \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.version.outputs.version }}
