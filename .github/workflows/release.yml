name: release

on:
  push:
    tags:
      - 'spring-boot-[0-9]+.x-v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Derive branch and version from the tag
        id: tag
        run: |
          echo "branch=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"
      - name: Check that the tagged commit is on its branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"
        env:
          BRANCH: ${{ steps.tag.outputs.branch }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      # Without cache-provider, the action uses Gradle's commercial caching service.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - run: nix develop --command ./gradlew build publish -Pversion="$VERSION"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
