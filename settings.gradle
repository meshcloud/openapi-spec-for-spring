pluginManagement {
  includeBuild('build-plugins')

  repositories {
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositories {
    mavenCentral()
  }
}

rootProject.name = 'openapi-spec-for-spring'

includeBuild('platforms')

include 'openapi-spec-for-spring-model'
include 'openapi-spec-for-spring-api'
include 'openapi-spec-for-spring-common'
include 'openapi-spec-for-spring-autoconfigure'
include 'openapi-spec-for-spring-web'
include 'openapi-spec-for-spring-webmvc'
include 'openapi-spec-for-spring-hateoas'
include 'openapi-spec-for-spring-data'
include 'openapi-spec-for-spring-starter'
include 'openapi-spec-for-spring-test'

include 'demo:openapi-spec-for-spring-demo-webmvc'
